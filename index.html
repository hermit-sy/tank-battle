<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢铁风暴 · 坦克大战</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141a24;
    --accent: #4fc3f7;
    --accent2: #ffd54f;
    --danger: #ff5252;
    --text: #e6edf3;
    --muted: #8b98a9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2434 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    user-select: none;
  }

  .game-shell {
    background: var(--panel);
    border: 1px solid #232c3b;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .titlebar h1 {
    font-size: 20px;
    letter-spacing: 2px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .titlebar .sub { color: var(--muted); font-size: 12px; letter-spacing: 1px; }

  .layout { display: flex; gap: 16px; align-items: stretch; }

  .canvas-wrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #2a3547;
    box-shadow: inset 0 0 0 1px #000;
  }
  canvas { display: block; }

  .hud {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: #0f1520;
    border: 1px solid #232c3b;
    border-radius: 10px;
    padding: 14px;
  }
  .card h3 {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .stat { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .stat b { color: var(--accent2); font-variant-numeric: tabular-nums; }

  .lives { display: flex; gap: 6px; flex-wrap: wrap; }
  .life {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, #66bb6a, #2e7d32);
    border-radius: 4px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.3);
  }
  .life.lost { background: #2a3547; }

  .keys { font-size: 12px; color: var(--muted); line-height: 1.8; }
  .keys span {
    display: inline-block; min-width: 22px; text-align: center;
    background: #1a2333; border: 1px solid #2f3b52; border-radius: 4px;
    padding: 1px 5px; margin-right: 4px; font-variant-numeric: tabular-nums;
  }

  .btn {
    width: 100%;
    border: none; cursor: pointer;
    padding: 12px; border-radius: 8px;
    font-size: 15px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), #0288d1);
    color: #04121f;
    transition: transform .06s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(2px); }
  .btn.ghost { background: transparent; border: 1px solid #2f3b52; color: var(--text); }

  .footnote { color: var(--muted); font-size: 11px; margin-top: 12px; text-align: center; letter-spacing: 1px; }

  .mute-btn {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,.45); color: #fff; border: 1px solid #33415a;
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 15px;
  }
</style>
</head>
<body>
<div class="game-shell">
  <div class="titlebar">
    <h1>钢铁风暴 · 坦克大战</h1>
    <span class="sub">STEEL STORM</span>
  </div>

  <div class="layout">
    <div class="canvas-wrap">
      <canvas id="game" width="448" height="448"></canvas>
      <button class="mute-btn" id="muteBtn" title="静音">🔊</button>
    </div>

    <div class="hud">
      <div class="card">
        <h3>战况</h3>
        <div class="stat"><span>得分</span><b id="score">0</b></div>
        <div class="stat"><span>波次</span><b id="wave">1</b></div>
        <div class="stat"><span>剩余敌军</span><b id="remaining">20</b></div>
        <div class="stat"><span>最高分</span><b id="best">0</b></div>
      </div>

      <div class="card">
        <h3>生命</h3>
        <div class="lives" id="lives"></div>
      </div>

      <div class="card">
        <h3>操作</h3>
        <div class="keys">
          <div><span>W</span><span>A</span><span>S</span><span>D</span> / 方向键 移动</div>
          <div><span>空格</span><span>J</span> 射击</div>
          <div><span>P</span> 暂停</div>
        </div>
      </div>

      <button class="btn" id="startBtn">开始游戏</button>
      <button class="btn ghost" id="pauseBtn">暂停</button>
    </div>
  </div>

  <div class="footnote">守护基地 ⛳ · 击毁所有敌军坦克</div>
</div>

<script>
(() => {
  "use strict";

  // ===== 画布与常量 =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const TILE = 32;
  const COLS = 13, ROWS = 13;           // 13x13 地图格子
  const W = COLS * TILE, H = ROWS * TILE;
  canvas.width = W; canvas.height = H;

  // 坦克尺寸略小于格子，便于在通道中穿行
  const TANK = 26;
  const SPEED = 90;                     // 像素/秒
  const BULLET_SPEED = 300;

  // ===== 地图符号 =====
  // . 空地  # 砖墙(可毁)  S 钢墙(不可毁)  W 水域  T 树林
  // B 基地(必须保护)  P 玩家出生点  E 敌军出生点
  const LEVEL = [
    "#..#..#..#..#",
    "#..#S#S#..#.#",
    "#..#S#S#..#.#",
    ".............",
    "#.#..#S#..#.#",
    "#.#..###..#.#",
    "E...#####...E",
    "#.#..###..#.#",
    "#.#..#S#..#.#",
    ".............",
    "#..#S#S#..#.#",
    "#..#S#S#..#.#",
    "#..#..#B..#.#",
  ];

  // ===== 游戏状态 =====
  const DIRS = {
    up:    { dx: 0, dy: -1, ang: 0 },
    right: { dx: 1, dy: 0,  ang: Math.PI / 2 },
    down:  { dx: 0, dy: 1,  ang: Math.PI },
    left:  { dx: -1, dy: 0, ang: -Math.PI / 2 },
  };
  const DIR_LIST = ["up", "right", "down", "left"];

  let state = "menu";                    // menu | playing | paused | gameover | win
  let score = 0;
  let best = 0;
  let wave = 1;
  let lives = 3;
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let powerups = [];
  let grid = [];                          // 2D 数组存储墙/地形
  let baseAlive = true;
  let spawnTimer = 0;
  let enemiesToSpawn = 0;
  let totalEnemiesThisWave = 0;
  let enemyShootCooldown = 0;
  let keys = {};

  try { best = parseInt(localStorage.getItem("steelstorm.best") || "0", 10); } catch (e) {}
  let muted = false;

  // ===== DOM 引用 =====
  const scoreEl = document.getElementById("score");
  const waveEl = document.getElementById("wave");
  const remainingEl = document.getElementById("remaining");
  const bestEl = document.getElementById("best");
  const livesEl = document.getElementById("lives");
  const startBtn = document.getElementById("startBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const muteBtn = document.getElementById("muteBtn");

  // ===== 音频 =====
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type = "square", vol = 0.12) {
    if (muted || !audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  }
  const sfxShoot = () => beep(880, 0.08, "square", 0.06);
  const sfxHit   = () => beep(220, 0.12, "sawtooth", 0.09);
  const sfxBoom  = () => { beep(120, 0.28, "sawtooth", 0.16); beep(60, 0.34, "triangle", 0.14); };
  const sfxPower = () => { beep(660, 0.09, "square", 0.08); setTimeout(() => beep(990, 0.12, "square", 0.08), 80); };

  // ===== 工具 =====
  function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
  function cellRowCol(px, py) { return { r: Math.floor(py / TILE), c: Math.floor(px / TILE) }; }

  function makeGrid() {
    const g = [];
    for (let r = 0; r < ROWS; r++) {
      g[r] = [];
      for (let c = 0; c < COLS; c++) {
        const ch = (LEVEL[r] && LEVEL[r][c]) ? LEVEL[r][c] : ".";
        g[r][c] = { type: ch, hp: ch === "#" ? 1 : Infinity };
      }
    }
    return g;
  }

  // ===== 实体 =====
  function makeTank(x, y, dir, kind) {
    return {
      x, y, dir, kind,               // kind: "player" | "enemy"
      speed: kind === "player" ? SPEED : SPEED * 0.62,
      alive: true,
      cooldown: 0,
      shield: kind === "player" ? 2.5 : 0,   // 出生无敌时间
      power: 1,                      // 弹威力（等级）
      fast: false,
    };
  }

  function tankCorners(t) {
    return {
      left: t.x, top: t.y,
      right: t.x + TANK, bottom: t.y + TANK,
    };
  }

  function tankCenter(t) { return { x: t.x + TANK / 2, y: t.y + TANK / 2 }; }

  function canOccupy(x, y, ignore) {
    if (x < 0 || y < 0 || x + TANK > W || y + TANK > H) return false;
    const c0 = cellRowCol(x, y);
    const c1 = cellRowCol(x + TANK - 1, y + TANK - 1);
    for (let r = c0.r; r <= c1.r; r++) {
      for (let c = c0.c; c <= c1.c; c++) {
        if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return false;
        const t = grid[r][c].type;
        if (t === "#" || t === "S" || t === "W" || t === "B") return false; // 树林可穿过
      }
    }
    // 与其他坦克碰撞
    for (const t of [player, ...enemies]) {
      if (!t || !t.alive || t === ignore) continue;
      const a = tankCorners(t);
      if (x < a.right && x + TANK > a.left && y < a.bottom && y + TANK > a.top) return false;
    }
    return true;
  }

  function moveTank(t, dir, dt) {
    if (!t || !t.alive) return;
    if (dir !== t.dir) { t.dir = dir; return; } // 只转向不移动会卡顿，改为直接转向即可
    const d = DIRS[dir];
    const nx = t.x + d.dx * t.speed * dt;
    const ny = t.y + d.dy * t.speed * dt;
    // 吸附到网格，避免卡墙
    const snapX = Math.round(t.x / TILE) * TILE;
    const snapY = Math.round(t.y / TILE) * TILE;
    if (d.dx !== 0) {
      const cy = Math.round(t.y / 2) * 2; // 简化：保持 y
      if (canOccupy(nx, t.y, t)) t.x = nx;
    } else {
      if (canOccupy(t.x, ny, t)) t.y = ny;
    }
    // 对齐到 2px 网格，减少卡顿
    t.x = Math.round(t.x / 2) * 2;
    t.y = Math.round(t.y / 2) * 2;
  }

  function fire(t) {
    if (!t || !t.alive || t.cooldown > 0) return;
    const c = tankCenter(t);
    const d = DIRS[t.dir];
    bullets.push({
      x: c.x + d.dx * (TANK / 2 + 3) - 2,
      y: c.y + d.dy * (TANK / 2 + 3) - 2,
      dx: d.dx, dy: d.dy,
      size: 5,
      owner: t.kind,
      power: t.power,
    });
    t.cooldown = t.kind === "player" ? 0.28 : 0.9;
    sfxShoot();
  }

  // ===== 波次 / 生成 =====
  function startWave() {
    enemies = [];
    bullets = [];
    powerups = [];
    grid = makeGrid();
    baseAlive = true;
    totalEnemiesThisWave = Math.min(4 + wave * 2, 20);
    enemiesToSpawn = totalEnemiesThisWave;
    spawnTimer = 0.5;
    // 重置玩家
    player = makeTank((COLS / 2) * TILE - TANK / 2, (ROWS - 1) * TILE - TANK, "up", "player");
    // 清理出生点附近的墙
    clearSpawn();
    updateHUD();
  }

  function clearSpawn() {
    const base = { r: ROWS - 2, c: Math.floor(COLS / 2) };
    for (let r = ROWS - 3; r < ROWS; r++) {
      for (let c = base.c - 1; c <= base.c + 1; c++) {
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          const t = grid[r][c].type;
          if (t === "#" || t === "S" || t === "W") grid[r][c] = { type: ".", hp: Infinity };
        }
      }
    }
  }

  function spawnEnemy() {
    const spots = [1, 6, 11].map(c => c * TILE - TANK / 2);
    const x = spots[Math.floor(Math.random() * spots.length)];
    const y = -TANK; // 从顶部进入
    const dir = "down";
    const e = makeTank(x, y, dir, "enemy");
    e.shield = 1.5;
    // 若出生点被占，稍后重试
    if (!canOccupy(x, 0, e)) { spawnTimer = 0.4; return; }
    enemies.push(e);
    enemiesToSpawn--;
  }

  function enemyAI(dt) {
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.shield > 0) e.shield -= dt;
      if (e.cooldown > 0) e.cooldown -= dt;

      // 偶尔改变方向
      if (Math.random() < 0.02) {
        e.dir = DIR_LIST[Math.floor(Math.random() * 4)];
      }
      // 朝玩家方向有概率射击
      const c = tankCenter(e);
      const pc = tankCenter(player);
      const dx = pc.x - c.x, dy = pc.y - c.y;
      if (Math.random() < 0.03 && e.cooldown <= 0) {
        if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? "right" : "left";
        else e.dir = dy > 0 ? "down" : "up";
        fire(e);
      }

      // 尝试移动；若受阻则换向
      const d = DIRS[e.dir];
      const nx = e.x + d.dx * e.speed * dt;
      const ny = e.y + d.dy * e.speed * dt;
      const moved = (d.dx !== 0) ? canOccupy(nx, e.y, e) : canOccupy(e.x, ny, e);
      if (moved) {
        if (d.dx !== 0) e.x = nx; else e.y = ny;
        e.x = Math.round(e.x / 2) * 2;
        e.y = Math.round(e.y / 2) * 2;
      } else {
        e.dir = DIR_LIST[Math.floor(Math.random() * 4)];
      }
    }
  }

  // ===== 子弹 =====
  function updateBullets(dt) {
    for (const b of bullets) {
      b.x += b.dx * BULLET_SPEED * dt;
      b.y += b.dy * BULLET_SPEED * dt;

      // 出界
      if (b.x < 0 || b.y < 0 || b.x > W || b.y > H) { b.dead = true; continue; }

      // 撞墙
      const c = cellRowCol(b.x + 2, b.y + 2);
      const t = grid[c.r] && grid[c.r][c.c];
      if (t) {
        if (t.type === "#") {
          t.hp -= b.power;
          b.dead = true;
          spawnParticles(b.x, b.y, "#c77826", 5);
          sfxHit();
          if (t.hp <= 0) { grid[c.r][c.c] = { type: ".", hp: Infinity }; }
        } else if (t.type === "S") {
          b.dead = true;
          spawnParticles(b.x, b.y, "#9aa7b8", 4);
          sfxHit();
        } else if (t.type === "B") {
          // 基地被毁
          b.dead = true;
          destroyBase();
        }
        // W / T 子弹可穿过
      }

      if (b.dead) continue;

      // 撞坦克
      const targetList = (b.owner === "player") ? enemies : [player];
      for (const t of targetList) {
        if (!t || !t.alive) continue;
        const a = tankCorners(t);
        if (b.x + b.size > a.left && b.x < a.right && b.y + b.size > a.top && b.y < a.bottom) {
          b.dead = true;
          if (t.shield > 0) {
            spawnParticles(b.x, b.y, "#4fc3f7", 6);
            sfxHit();
          } else {
            t.alive = false;
            spawnParticles(t.x + TANK / 2, t.y + TANK / 2, "#ff7043", 16);
            sfxBoom();
            if (t.kind === "enemy") {
              score += 100 * t.power;
              maybeDropPowerup(t.x, t.y);
            }
          }
          break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);
  }

  function destroyBase() {
    if (!baseAlive) return;
    baseAlive = false;
    grid[ROWS - 2][Math.floor(COLS / 2)] = { type: "X", hp: Infinity }; // 标记摧毁
    spawnParticles((COLS / 2) * TILE, (ROWS - 2) * TILE, "#ff5252", 24);
    sfxBoom();
    setTimeout(() => { if (state === "playing") endGame(false); }, 800);
  }

  // ===== 强化道具 =====
  function maybeDropPowerup(x, y) {
    if (Math.random() < 0.25) {
      const kinds = ["life", "star", "shield", "fast"];
      powerups.push({ x, y, kind: kinds[Math.floor(Math.random() * kinds.length)], t: 0 });
    }
  }
  function updatePowerups(dt) {
    for (const p of powerups) {
      p.t += dt;
      if (p.t > 12) p.dead = true;
      if (player && player.alive) {
        const a = tankCorners(player);
        if (p.x + 20 > a.left && p.x < a.right && p.y + 20 > a.top && p.y < a.bottom) {
          applyPowerup(p.kind);
          p.dead = true;
        }
      }
    }
    powerups = powerups.filter(p => !p.dead);
  }
  function applyPowerup(kind) {
    sfxPower();
    if (kind === "life") {
      lives = Math.min(lives + 1, 9);
    } else if (kind === "star") {
      player.power = Math.min(player.power + 1, 3);
      score += 50;
    } else if (kind === "shield") {
      player.shield = Math.max(player.shield, 8);
    } else if (kind === "fast") {
      player.fast = true;
      player.speed = SPEED * 1.4;
      setTimeout(() => { if (player) { player.fast = false; player.speed = SPEED; } }, 8000);
    }
    updateHUD();
  }

  // ===== 粒子 =====
  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.4, color });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ===== 游戏流程 =====
  function endGame(win) {
    state = win ? "win" : "gameover";
    if (score > best) { best = score; try { localStorage.setItem("steelstorm.best", String(best)); } catch (e) {} }
    startBtn.textContent = "再来一局";
    updateHUD();
  }

  function checkWin() {
    if (enemiesToSpawn <= 0 && enemies.every(e => !e.alive)) {
      wave++;
      if (wave > 5) { endGame(true); return; }
      startWave();
      flashMessage(`第 ${wave} 波！`);
    }
  }

  function playerDie() {
    if (!player || !player.alive) return;
    player.alive = false;
    spawnParticles(player.x + TANK / 2, player.y + TANK / 2, "#66bb6a", 20);
    sfxBoom();
    lives--;
    updateHUD();
    if (lives <= 0) { endGame(false); return; }
    setTimeout(() => {
      if (state !== "playing") return;
      player = makeTank((COLS / 2) * TILE - TANK / 2, (ROWS - 1) * TILE - TANK, "up", "player");
      player.shield = 2.5;
    }, 700);
  }

  function update(dt) {
    if (state !== "playing") return;

    // 玩家输入
    if (player && player.alive) {
      if (player.shield > 0) player.shield -= dt;
      if (player.cooldown > 0) player.cooldown -= dt;
      let moving = false;
      const order = ["up", "down", "left", "right"];
      for (const d of order) {
        if (keys[d]) { moveTank(player, d, dt); moving = true; break; }
      }
      if (keys.fire) { fire(player); keys.fire = false; }
    }

    // 敌军生成
    if (enemiesToSpawn > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = 1.1; }
    }

    enemyAI(dt);
    updateBullets(dt);
    updateParticles(dt);
    updatePowerups(dt);

    // 检测玩家死亡（被敌军撞到视为同归于尽处理由子弹覆盖，这里检测敌人撞基地）
    if (!baseAlive) { /* 已处理 */ }

    // 敌人撞基地
    if (baseAlive) {
      const bc = { x: Math.floor(COLS / 2) * TILE, y: (ROWS - 2) * TILE, w: TILE, h: TILE };
      for (const e of enemies) {
        if (!e.alive) continue;
        const a = tankCorners(e);
        if (a.right > bc.x && a.left < bc.x + bc.w && a.bottom > bc.y && a.top < bc.y + bc.h) {
          e.alive = false;
          spawnParticles(bc.x + TILE / 2, bc.y + TILE / 2, "#ff7043", 16);
          destroyBase();
          break;
        }
      }
    }

    checkWin();
    updateHUD();
  }

  let flashText = "";
  let flashT = 0;
  function flashMessage(msg) { flashText = msg; flashT = 2; }
  if (flashT > 0) flashT -= 0; // 占位，实际在 render 更新

  // ===== 渲染 =====
  function drawTank(t) {
    if (!t || !t.alive) return;
    ctx.save();
    const c = tankCenter(t);
    ctx.translate(c.x, c.y);
    ctx.rotate(DIRS[t.dir].ang);

    // 履带
    const body = t.kind === "player" ? "#3f9142" : "#c0392b";
    const track = t.kind === "player" ? "#2e7d32" : "#922b21";
    rect(-TANK / 2, -TANK / 2, TANK, TANK * 0.18, track);
    rect(-TANK / 2, TANK / 2 - TANK * 0.18, TANK, TANK * 0.18, track);
    // 车身
    rect(-TANK / 2, -TANK / 2 + 4, TANK, TANK - 8, body);
    // 炮塔
    rect(-TANK * 0.18, -TANK * 0.18, TANK * 0.36, TANK * 0.36, t.kind === "player" ? "#66bb6a" : "#e74c3c");
    // 炮管
    rect(-2, -TANK / 2, 4, TANK * 0.5, "#263238");

    ctx.restore();

    // 护盾特效
    if (t.shield > 0) {
      ctx.save();
      ctx.strokeStyle = "rgba(79,195,247,.9)";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(t.x - 2, t.y - 2, TANK + 4, TANK + 4);
      ctx.restore();
    }
  }

  function drawGrid() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        const x = c * TILE, y = r * TILE;
        if (t.type === ".") continue;
        if (t.type === "#") {
          // 砖墙
          rect(x, y, TILE, TILE, "#8d5524");
          rect(x, y, TILE, 2, "#5c3a1a");
          rect(x, y + TILE - 2, TILE, 2, "#5c3a1a");
          rect(x, y, 2, TILE, "#5c3a1a");
          rect(x + TILE - 2, y, 2, TILE, "#5c3a1a");
          rect(x + TILE / 2, y, 2, TILE, "#7a4a1f");
          rect(x, y + TILE / 2, TILE, 2, "#7a4a1f");
        } else if (t.type === "S") {
          rect(x, y, TILE, TILE, "#5d6d7e");
          rect(x + 3, y + 3, TILE - 6, TILE - 6, "#83919f");
          rect(x + 6, y + 6, TILE - 12, TILE - 12, "#aeb6bf");
        } else if (t.type === "W") {
          const t2 = performance.now() / 500;
          rect(x, y, TILE, TILE, "#1565c0");
          ctx.fillStyle = "rgba(144,202,249,.6)";
          for (let i = 0; i < 3; i++) {
            const yy = y + ((t2 + i * 10) % TILE);
            ctx.fillRect(x + 2, yy, TILE - 4, 3);
          }
        } else if (t.type === "T") {
          rect(x, y, TILE, TILE, "#1b5e20");
          ctx.fillStyle = "#2e7d32";
          ctx.beginPath();
          ctx.arc(x + TILE / 2, y + TILE / 2, TILE * 0.45, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#388e3c";
          ctx.beginPath();
          ctx.arc(x + TILE / 3, y + TILE / 3, TILE * 0.28, 0, Math.PI * 2);
          ctx.fill();
        } else if (t.type === "B") {
          // 基地（鹰）
          rect(x, y, TILE, TILE, "#455a64");
          rect(x + 2, y + 2, TILE - 4, TILE - 4, "#37474f");
          drawEagle(x + TILE / 2, y + TILE / 2);
        } else if (t.type === "X") {
          rect(x, y, TILE, TILE, "#263238");
          ctx.fillStyle = "#ff5252";
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("✕", x + TILE / 2, y + TILE / 2);
        }
      }
    }
  }

  function drawEagle(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "#ffd54f";
    // 简化鹰形
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(6, 0); ctx.lineTo(12, -4); ctx.lineTo(6, 8); ctx.lineTo(0, 12);
    ctx.lineTo(-6, 8); ctx.lineTo(-12, -4); ctx.lineTo(-6, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBullets() {
    for (const b of bullets) {
      rect(b.x, b.y, b.size, b.size, "#fff59d");
    }
  }

  function drawPowerups() {
    for (const p of powerups) {
      const blink = Math.sin(p.t * 8) > 0;
      if (p.t > 9 && blink) continue;
      const colors = { life: "#66bb6a", star: "#ffd54f", shield: "#4fc3f7", fast: "#ff8a65" };
      const icon = { life: "❤", star: "★", shield: "🛡", fast: "⚡" };
      ctx.fillStyle = colors[p.kind];
      ctx.beginPath();
      ctx.arc(p.x + 10, p.y + 10, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#111";
      ctx.font = "12px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(icon[p.kind], p.x + 10, p.y + 11);
    }
  }

  function drawOverlay() {
    if (state === "menu" || state === "gameover" || state === "win") {
      ctx.fillStyle = "rgba(6,9,14,.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#e6edf3";
      ctx.font = "bold 34px 'Segoe UI', sans-serif";
      const title = state === "menu" ? "钢铁风暴" : state === "win" ? "胜利！" : "游戏结束";
      ctx.fillText(title, W / 2, H / 2 - 24);
      ctx.fillStyle = "#8b98a9";
      ctx.font = "15px 'Segoe UI', sans-serif";
      const sub = state === "menu" ? "按「开始游戏」进入战场" : "按「再来一局」继续战斗";
      ctx.fillText(sub, W / 2, H / 2 + 14);
      if (state !== "menu") {
        ctx.fillStyle = "#ffd54f";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(`得分 ${score}`, W / 2, H / 2 + 52);
      }
    }
    if (flashT > 0) {
      flashT -= 0.016;
      ctx.fillStyle = `rgba(255,213,79,${Math.min(1, flashT)})`;
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(flashText, W / 2, H / 2 - 60);
    }
    if (state === "paused") {
      ctx.fillStyle = "rgba(6,9,14,.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 30px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("已暂停", W / 2, H / 2);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    // 地面
    ctx.fillStyle = "#0f141d";
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawPowerups();
    drawBullets();
    // 坦克按 y 排序绘制
    const tanks = [player, ...enemies].filter(t => t && t.alive).sort((a, b) => a.y - b.y);
    for (const t of tanks) drawTank(t);
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      ctx.globalAlpha = 1;
    }
    drawOverlay();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    waveEl.textContent = wave;
    remainingEl.textContent = enemiesToSpawn + enemies.filter(e => e.alive).length;
    bestEl.textContent = best;
    livesEl.innerHTML = "";
    for (let i = 0; i < Math.max(lives, 0); i++) {
      const d = document.createElement("div");
      d.className = "life" + (i < lives ? "" : " lost");
      livesEl.appendChild(d);
    }
  }

  // ===== 主循环 =====
  let last = performance.now();
  function loop(now) {
    let dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ===== 输入 =====
  const keyMap = {
    ArrowUp: "up", KeyW: "up",
    ArrowDown: "down", KeyS: "down",
    ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right",
    Space: "fire", KeyJ: "fire",
  };
  document.addEventListener("keydown", (e) => {
    ensureAudio();
    const k = keyMap[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
    if (e.code === "KeyP") { togglePause(); }
  });
  document.addEventListener("keyup", (e) => {
    const k = keyMap[e.code];
    if (k) keys[k] = false;
  });

  function togglePause() {
    if (state === "playing") { state = "paused"; pauseBtn.textContent = "继续"; }
    else if (state === "paused") { state = "playing"; pauseBtn.textContent = "暂停"; }
  }

  startBtn.addEventListener("click", () => {
    ensureAudio();
    score = 0; wave = 1; lives = 3;
    startWave();
    state = "playing";
    startBtn.textContent = "重新开始";
    pauseBtn.textContent = "暂停";
  });
  pauseBtn.addEventListener("click", togglePause);
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  // 初始化
  grid = makeGrid();
  player = makeTank((COLS / 2) * TILE - TANK / 2, (ROWS - 1) * TILE - TANK, "up", "player");
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
